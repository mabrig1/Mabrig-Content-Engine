name: CI

on:
  push:
    branches: [main, develop, 'claude/**', 'feature/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop, 'claude/**', 'feat/**']

env:
  NODE_VERSION: '22'

jobs:
  # ─── Type Check & Lint ────────────────────────────────────────────────────
  quality:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @mabrig/web db:generate
        env:
          DATABASE_URL: postgresql://mabrig:password@localhost:5432/mabrig_content_engine

      - name: TypeScript check
        run: pnpm --filter @mabrig/web exec tsc --noEmit

      - name: ESLint
        run: pnpm --filter @mabrig/web lint

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://mabrig:password@localhost:5432/mabrig_content_engine
      NEXTAUTH_SECRET: ci-test-secret-minimum-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: MABRIG Content Engine

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @mabrig/web db:generate

      - name: Build
        run: pnpm --filter @mabrig/web build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: next-build
          path: apps/web/.next
          retention-days: 7

  # ─── Docker (main only) ───────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: ghcr.io/mabrig1/mabrig-content-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cloudflare-package:
    name: Cloudflare Worker adapter dry-run
    runs-on: ubuntu-latest
    needs: build
    env:
      DATABASE_URL: postgresql://mabrig:password@localhost:5432/mabrig_content_engine
      NEXTAUTH_SECRET: ci-test-secret-minimum-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @mabrig/web db:generate
      - name: Build Cloudflare adapter and bundle without deploying
        run: pnpm --filter @mabrig/web cf:dry-run
      - name: Smoke test Worker homepage and login locally
        shell: bash
        run: |
          set -euo pipefail
          cd apps/web
          pnpm exec wrangler dev --local --port 8787 > /tmp/mabrig-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; tail -100 /tmp/mabrig-worker.log || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/ -o /tmp/mabrig-home.html; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "Worker failed to serve the homepage"
            exit 1
          fi
          curl -fsS --max-time 20 http://127.0.0.1:8787/login -o /tmp/mabrig-login.html
          grep -qi 'login' /tmp/mabrig-login.html
          echo "Worker homepage and login smoke tests passed"


  cloudflare-default-flow:
    name: Cloudflare dashboard command parity (no deploy)
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://mabrig:password@localhost:5432/mabrig_content_engine
      NEXTAUTH_SECRET: ci-test-secret-minimum-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Reproduce Cloudflare installer
        run: bun install
      - name: Reproduce existing Cloudflare build command
        run: npm run build
      - name: Verify root worker config and adapter bundle without deployment
        run: pnpm exec wrangler deploy --dry-run --outdir=.cloudflare-dry-run
